# cantica-tech YAML standard (yamllint). Synced as `.standards/yamllint.yaml`; a repository's
# `.yamllint.yaml` says `extends: .standards/yamllint.yaml`.
extends: default
rules:
  line-length: disable
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]   # GitHub Actions' `on:`
  comments:
    min-spaces-from-content: 1
  indentation:
    indent-sequences: consistent
ignore: |
  node_modules/
  dist/
  out/
