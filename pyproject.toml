[project]
name = "catalyst-users"
version = "0.11.0"
description = "A command-line facade to any identity provider (Keycloak built in, others registered): a stdlib-only core, a CLI and a FastAPI integration"
readme = "README.md"
authors = [
    { name = "Olivier Steck", email = "osteck@gmail.com" }
]
requires-python = ">=3.11"
# The core is standard-library only (env-RUNTIME-000002): stage two vendors it into catalyst's zipapp.
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]

[project.scripts]
catalyst-users = "catalyst_users.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.115",  # the extra, so a plain `uv run pytest` can import fastapi_auth
    "httpx2>=2.16.0",
    "pytest>=8",
    "ruff==0.16.10",  # the version cantica-tech/standards runs (v0.1.2)
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
