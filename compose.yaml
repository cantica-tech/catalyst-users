# Local identity provider for development and integration tests (env-LOCAL-000001).
# DEV ONLY: the bootstrap admin password below is a development credential, reachable on the
# loopback address only. keycloak/realm-catalyst.json holds no person and no secret.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only-admin-password
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-catalyst.json:/opt/keycloak/data/import/realm-catalyst.json:ro
      # The dev database (H2), kept on the host so users survive a recreate.
      - ./.keycloack/data:/opt/keycloak/data/h2
